server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:h2:file:./data/curiodb
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:my-super-secret-key-change-me-now-1234567890}
    expiration-ms: 86400000
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
  google:
    client-id: ${GOOGLE_CLIENT_ID:679235122244-sijko890pkmrj9s1udg36ag26mgr1q1n.apps.googleusercontent.com}
